[project]
name = "intervwd"
version = "0.1.0"
description = "Intervwd: AI voice interviews for hiring rounds, with an MCP server for Alexa+."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "mcp==2.3.0",
    "boto3>=1.43",
    "starlette>=1.7",
    "uvicorn>=0.54",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = ["pytest>=9", "httpx>=0.28"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["intervwd"]
